<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Dashboard – Solicitações Ativas</title>
<style>:root{--bg:#f6f7f9;--card:#fff;--tx:#1d2330;--mu:#6b7385;--ac:#2f6fed;--ac2:#e8eefc;--bd:#e3e6ec;--wa:#d9534f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151c;--card:#1b2029;--tx:#e8ebf2;--mu:#9aa3b5;--ac:#6c9bff;--ac2:#26304a;--bd:#2a3140;--wa:#ff7b76}}
:root[data-theme="dark"]{--bg:#12151c;--card:#1b2029;--tx:#e8ebf2;--mu:#9aa3b5;--ac:#6c9bff;--ac2:#26304a;--bd:#2a3140;--wa:#ff7b76}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:20px}
h1{font-size:22px;margin:0}p.s{color:var(--mu);margin:4px 0 18px}
.g{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));max-width:1200px;margin:auto}
.k{grid-template-columns:repeat(auto-fit,minmax(160px,1fr));margin-bottom:14px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px}
.kv{font-size:30px;font-weight:700}.kl{color:var(--mu);font-size:13px}
h2{font-size:14px;margin:0 0 12px;color:var(--mu);text-transform:uppercase;letter-spacing:.04em}
.r{display:grid;grid-template-columns:minmax(90px,38%) 1fr 34px;gap:8px;align-items:center;margin:6px 0;font-size:13px}
.r span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.t{background:var(--ac2);border-radius:4px;height:10px}.t i{display:block;height:100%;background:var(--ac);border-radius:4px}.r b{text-align:right}
.w i{background:var(--wa)}.n{color:var(--mu);font-size:12px;margin-top:10px}.cols{columns:2 340px;column-gap:28px}.r{break-inside:avoid}.tb{width:100%;border-collapse:collapse;font-size:13px}.tb th{color:var(--mu);font-weight:600;text-align:right;padding:6px 8px;border-bottom:1px solid var(--bd)}.tb td{padding:7px 8px;text-align:right;border-bottom:1px solid var(--bd)}.tb th:first-child,.tb td:first-child{text-align:left}.tb .z{color:var(--mu)}.tb .h{color:var(--wa);font-weight:700}.wide{grid-column:1/-1}
.col{display:flex;align-items:flex-end;gap:8px;height:150px}.col div{flex:1;text-align:center;font-size:11px;color:var(--mu)}.col i{display:block;background:var(--ac);border-radius:4px 4px 0 0;margin-bottom:4px}.col b{color:var(--tx);display:block}</style></head><body>
<div style="max-width:1200px;margin:auto"><h1>Solicitações ativas</h1><p class="s">Filtro Potencializa · extraído em 09/11/2026 · todas com status Ativo</p></div>
<div class="g k" id="k"></div><div class="g" id="g"></div>
<script>const V=[["Victoria De Maia Goncalves Ignacio", 72, 40, 8, 284], ["Raisse Naiara Abreu Coutinho", 32, 15, 1, 74], ["Gabrielle De Medeiros Muniz", 84, 6, 2, 234], ["Lauanda Ramos Dos Santos", 29, 5, 4, 213], ["Ana Beatriz Moura Dos Santos", 20, 5, 3, 137], ["Elizangela Areia Leao", 24, 4, 3, 149], ["Paulyne Soares Borges", 15, 1, 1, 82], ["Cassiane Santos Barros", 13, 1, 0, 39], ["Cintya Calisto Souza", 1, 1, 0, 59], ["Jesse Naves Da Silva", 5, 1, 0, 41], ["Valeria Brito Nascimento", 7, 0, 0, 10]];const D={"total": 302, "med": 16, "old": 79, "old60": 22, "area": [["CRC", 184], ["Financeira", 62], ["Personalização", 20], ["MATEC", 19], ["Jurídico", 17]], "sub": [["Débitos da Unidade", 95], ["Assuntos de Personalização", 20], ["2ª Via de Boleto Antes do Vencimento", 18], ["Assistência Técnica", 18], ["Reclamações", 17], ["Entrega de Unidades", 16], ["Projetos", 15], ["Dúvidas Sobre Parcelas", 10], ["2ª Via de Documentos", 7], ["Dúvida Vistoria / Entrega de Empreendimento / Chaves", 7], ["Atualização Cadastral", 6], ["Dúvidas técnicas", 6], ["Boleto de Quitação", 5], ["Renegociação", 5], ["Termo de Quitação", 5], ["Dúvidas Sobre Cessão de Direitos", 5], ["Visita à Obra", 4], ["2ª Via de Boleto Após o Vencimento", 4], ["Boleto de Amortização", 4], ["Cessão de Direitos", 4], ["Externos / Engano", 3], ["Promoções de Clientes", 3], ["Boleto Antecipação de Parcelas", 3], ["Duvidas Indexadores", 3], ["Dúvidas Contrato de Compra e Venda", 3], ["Dúvidas", 2], ["Dúvidas sobre Financiamento", 2], ["Extrato Financeiro", 2], ["Aditivos Contratuais - Assuntos Gerais", 2], ["Notificação Extrajudicial", 2], ["Dúvidas Sobre Distrato", 1], ["Visita à Unidade", 1], ["Vistoria de Unidade", 1], ["Extrato Imposto de Renda", 1], ["Escrituração - Unidade Quitada", 1], ["Pendência de Vistoria", 1]], "origem": [["Email", 83], ["WhatsApp", 82], ["Solicitação Interna", 71], ["Telefone", 42], ["Portal do Cliente", 13], ["Reclame Aqui", 8], ["Presencial", 2]], "dono": [["Gabrielle De Medeiros Muniz", 84], ["Victoria De Maia Goncalves Ignacio", 72], ["Raisse Naiara Abreu Coutinho", 32], ["Lauanda Ramos Dos Santos", 29], ["Elizangela Areia Leao", 24], ["Ana Beatriz Moura Dos Santos", 20], ["Paulyne Soares Borges", 15], ["Cassiane Santos Barros", 13], ["Valeria Brito Nascimento", 7], ["Jesse Naves Da Silva", 5], ["Cintya Calisto Souza", 1]], "emp": [["Wish Vaca Brava", 66], ["Sem empreendimento", 38], ["Vida Samambaia", 31], ["Metropolitan Bueno", 11], ["Metropolitan Genebra", 11], ["Now Praça C8", 11], ["Smart Parque Areião", 9], ["Wish Trinta e Sete", 7]], "sememp": 38, "age": [["0–7 dias", 99], ["8–15 dias", 39], ["16–30 dias", 85], ["31–60 dias", 57], ["+60 dias", 22]], "mes": [["2026-01", 2], ["2026-03", 1], ["2026-04", 1], ["2026-05", 1], ["2026-06", 2], ["2026-07", 5], ["2026-08", 10], ["2026-09", 22], ["2026-10", 159], ["2026-11", 99]]};
const bar=(a,cls='')=>{const m=Math.max(...a.map(x=>x[1]));return a.map(x=>`<div class="r ${cls}"><span title="${x[0]}">${x[0]}</span><span class="t"><i style="width:${x[1]/m*100}%"></i></span><b>${x[1]}</b></div>`).join('')};
const col=(a,cls='')=>{const m=Math.max(...a.map(x=>x[1]));return `<div class="col ${cls}">`+a.map(x=>`<div><b>${x[1]}</b><i style="height:${x[1]/m*100}px"></i>${x[0]}</div>`).join('')+'</div>'};
const p=(n)=>Math.round(n/D.total*100)+'%';
document.getElementById('k').innerHTML=[[D.total,'Solicitações ativas'],[D.med+' dias','Idade mediana'],[D.old+' ('+p(D.old)+')','Abertas há +30 dias'],[D.old60,'Abertas há +60 dias']].map(x=>`<div class="c"><div class="kv">${x[0]}</div><div class="kl">${x[1]}</div></div>`).join('');
const card=(t,h,n='',w='')=>`<div class="c ${w}"><h2>${t}</h2>${h}${n?`<div class="n">${n}</div>`:''}</div>`;

document.getElementById('g').innerHTML=
card('Por assunto',`<div class="cols">${bar(D.sub)}</div>`,`${D.sub[0][0]} é o maior assunto: ${D.sub[0][1]} solicitações (${p(D.sub[0][1])}).`,'wide')+
card('Por origem',bar(D.origem),`E-mail, WhatsApp e solicitação interna somam ${p(D.origem[0][1]+D.origem[1][1]+D.origem[2][1])}.`)+
card('Idade da fila (dias desde a criação)',col(D.age),'',)+
card('Criadas por mês',col(D.mes),'Pico em outubro: fila recente, mas com resíduo antigo.')+

card('Top empreendimentos',bar(D.emp),`${D.sememp} solicitações sem empreendimento preenchido.`)+
card('Solicitações há mais de 30 dias, por proprietário',`<div style="overflow-x:auto"><table class="tb"><tr><th>Proprietário</th><th>Ativas</th><th>+30 dias</th><th>% da carga</th><th>+60 dias</th><th>Mais antiga</th></tr>${V.map(v=>`<tr><td>${v[0]}</td><td>${v[1]}</td><td class="${v[2]?'h':'z'}">${v[2]}</td><td>${Math.round(v[2]/v[1]*100)}%</td><td class="${v[3]?'h':'z'}">${v[3]}</td><td>${v[4]} dias</td></tr>`).join('')}</table></div>`,'Idade contada em dias desde a criação, até 09/11/2026.','wide')+card('Carga por proprietário',bar(D.dono),'','wide');
</script></body></html>
